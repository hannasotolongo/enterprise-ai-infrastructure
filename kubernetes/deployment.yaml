apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-ai-inference

spec:
  replicas: 1

  selector:
    matchLabels:
      app: enterprise-ai-inference

  template:
    metadata:
      labels:
        app: enterprise-ai-inference

    spec:
      containers:
        - name: enterprise-ai-inference
          image: ghcr.io/hannasotolongo/enterprise-ai-inference:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"